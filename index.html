<!doctype html>
<html>
    <head lang="en-us">
        <title>to do list v2.0</title>
        <link rel="stylesheet" href="styles.css">
        <meta charset="utf-8">
    </head>
    <body>
        <main>
            <h1>to do app</h1>
            <div class="to-do-section">
                <h2>to do:</h2>
            </div>

            <div class="in-progress-section">
                <h2>in progress:</h2>
            </div>

            <div class="completed-section">
                <h2>completed:</h2>
            </div>

            <button class="test-button">add task</button>

            <div class="pop-up-1">
                <input type="radio" id="add" name="group1">
                <label for="add">Add to "in progress"</label>
                <input type="radio" id="remove" name="group1">
                <label for="remove">remove</label>
            </div>

            <button id="confirm-btn">confirm</button>
        </main>
        

        <script src="app.js"></script> 
    </body>
</html>
